name: microservice-app-example

services:

  frontend:
    build: ./frontend
    image: microservice-app-example/frontend
    environment:
      PORT: 8080
      AUTH_API_ADDRESS: http://auth-api:8081
      TODOS_API_ADDRESS: http://todos-api:8082
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    depends_on:
      auth-api:
        condition: service_healthy
      todos-api:
        condition: service_healthy
      zipkin:
        condition: service_started

  auth-api:
    build: ./auth-api
    image: microservice-app-example/auth-api
    environment:
      AUTH_API_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-myfancysecret}
      USERS_API_ADDRESS: http://users-api:8083
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8081:8081"
    depends_on:
      users-api:
        condition: service_healthy
      zipkin:
        condition: service_started

  todos-api:
    build: ./todos-api
    image: microservice-app-example/todos-api
    environment:
      TODO_API_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-myfancysecret}
      REDIS_HOST: redis-queue
      REDIS_PORT: 6379
      REDIS_CHANNEL: log_channel
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8082:8082"
    depends_on:
      redis-queue:
        condition: service_healthy
      zipkin:
        condition: service_started

  users-api:
    build: ./users-api
    image: microservice-app-example/users-api
    environment:
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-myfancysecret}
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
      # Si tras probar no se ven trazas de users-api en http://localhost:9411,
      # esta es la alternativa a prueba de dudas (ver docs/COMPOSE.md):
      # JAVA_TOOL_OPTIONS: -Dspring.zipkin.baseUrl=http://zipkin:9411
    ports:
      - "8083:8083"
    depends_on:
      zipkin:
        condition: service_started

  log-message-processor:
    build: ./log-message-processor
    image: microservice-app-example/log-message-processor
    environment:
      REDIS_HOST: redis-queue
      REDIS_PORT: 6379
      REDIS_CHANNEL: log_channel
      ZIPKIN_URL: http://zipkin:9411/api/v1/spans
      LOG_PERSIST_PATH: /data/processed.log
      # Ambas vacías por defecto: sin ellas, el filtro notify solo registra
      # el error por log en vez de enviar un correo (ver docs/DOCKER.md sección 5).
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_TO: ${SENDGRID_TO:-}
    volumes:
      - log-data:/data
    depends_on:
      redis-queue:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:2
    ports:
      - "9411:9411"

  redis-queue:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  log-data: