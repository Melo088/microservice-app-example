name: microservice-app-example

services:

  frontend:
    image: melo15036/microservice-app-example-frontend:${IMAGE_TAG:-latest}
    environment:
      PORT: 8080
      AUTH_API_ADDRESS: http://auth-api:8081
      TODOS_API_ADDRESS: http://todos-api:8082
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    ports:
      - "8080:8080"
    depends_on:
      auth-api:
        condition: service_healthy
      todos-api:
        condition: service_healthy
      zipkin:
        condition: service_started

  auth-api:
    image: melo15036/microservice-app-example-auth-api:${IMAGE_TAG:-latest}
    environment:
      AUTH_API_PORT: 8081
      JWT_SECRET: ${JWT_SECRET:-myfancysecret}
      USERS_API_ADDRESS: http://users-api:8083
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      users-api:
        condition: service_healthy
      zipkin:
        condition: service_started

  todos-api:
    image: melo15036/microservice-app-example-todos-api:${IMAGE_TAG:-latest}
    environment:
      TODO_API_PORT: 8082
      JWT_SECRET: ${JWT_SECRET:-myfancysecret}
      REDIS_HOST: redis-queue
      REDIS_PORT: 6379
      REDIS_CHANNEL: log_channel
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      redis-queue:
        condition: service_healthy
      zipkin:
        condition: service_started

  users-api:
    image: melo15036/microservice-app-example-users-api:${IMAGE_TAG:-latest}
    environment:
      SERVER_PORT: 8083
      JWT_SECRET: ${JWT_SECRET:-myfancysecret}
      SPRING_ZIPKIN_BASE_URL: http://zipkin:9411
    depends_on:
      zipkin:
        condition: service_started

  log-message-processor:
    image: melo15036/microservice-app-example-log-message-processor:${IMAGE_TAG:-latest}
    environment:
      REDIS_HOST: redis-queue
      REDIS_PORT: 6379
      REDIS_CHANNEL: log_channel
      ZIPKIN_URL: http://zipkin:9411/api/v1/spans
      LOG_PERSIST_PATH: /data/processed.log
      SENDGRID_API_KEY: ${SENDGRID_API_KEY:-}
      SENDGRID_TO: ${SENDGRID_TO:-}
    volumes:
      - log-data:/data
    depends_on:
      redis-queue:
        condition: service_healthy

  zipkin:
    image: openzipkin/zipkin:2
    ports:
      - "9411:9411"

  redis-queue:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  log-data:
