# Plantilla. Copiar a 02-secret.yaml (ignorado por git, mismo patron que
# .env.example y ansible/inventory.example.ini) y completar con valores
# propios antes de aplicar. stringData acepta texto plano: Kubernetes lo
# codifica a base64 solo al guardarlo, no hace falta codificarlo a mano.
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: microservice-app-example
type: Opaque
stringData:
  JWT_SECRET: myfancysecret
  SENDGRID_API_KEY: ""
  SENDGRID_TO: ""
