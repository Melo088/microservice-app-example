apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-api
  namespace: microservice-app-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-api
  template:
    metadata:
      labels:
        app: auth-api
    spec:
      # uid 100, el usuario "app" real dentro de la imagen (confirmado con
      # "docker run --rm --entrypoint id ..."). runAsNonRoot por si solo no
      # alcanza: Kubernetes no resuelve nombres de usuario del USER del
      # Dockerfile, necesita el UID numerico para poder verificarlo.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
      containers:
        - name: auth-api
          image: melo15036/microservice-app-example-auth-api:latest
          ports:
            - containerPort: 8081
          env:
            - name: AUTH_API_PORT
              valueFrom:
                configMapKeyRef: { name: app-config, key: AUTH_API_PORT }
            - name: USERS_API_ADDRESS
              valueFrom:
                configMapKeyRef: { name: app-config, key: USERS_API_ADDRESS }
            - name: ZIPKIN_URL
              valueFrom:
                configMapKeyRef: { name: app-config, key: ZIPKIN_URL_V2 }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
          # GET /version, la misma ruta real que ya usa el HEALTHCHECK de
          # Docker (ver docs/DOCKER.md seccion 3).
          readinessProbe:
            httpGet: { path: /version, port: 8081 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /version, port: 8081 }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-api
  namespace: microservice-app-example
spec:
  selector:
    app: auth-api
  ports:
    - port: 8081
      targetPort: 8081
